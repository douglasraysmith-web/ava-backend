name: AVA Technical Safety

on:
  push:
    branches:
      - fix/ava-rf-distributed-audio-safety-v1
  pull_request:
    branches:
      - main

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run check
      - run: npm test
